# Конфигурация исследования. Все изменяемые числа — здесь, не в коде.

universe:
  exchange: bybit
  category: linear          # линейные перпетуалы USDT
  price: last               # цена last trade
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  # Дата фиксации СОСТАВА вселенной (листинг последней пары, SOLUSDT).
  # Это не обрезка истории: BTC и ETH используют всю доступную историю.
  fixed_on: "2021-10-15"
  # Данные до даты — только прогрев индикаторов, НЕ обучение и НЕ оценка.
  # BTCUSDT 2020: неликвидный период (≈28.5 тыс. минут без сделок).
  warmup_only_until:
    BTCUSDT: "2021-01-01"
    # H2: usable_from = позднейшая из (первый полный бар, 2021-01-01) — пол
    # 2021-01-01 для пар с данными раньше (первый полный бар даёт clean).
    XRPUSDT: "2021-01-01"
    ADAUSDT: "2021-01-01"
    DOGEUSDT: "2021-01-01"
    XTZUSDT: "2021-01-01"
    DOTUSDT: "2021-01-01"
    LTCUSDT: "2021-01-01"
    LINKUSDT: "2021-01-01"
    ETCUSDT: "2021-01-01"
    BNBUSDT: "2021-01-01"
    BCHUSDT: "2021-01-01"
  # Первые бары по /v5/market/kline (проверено 2026-10-01).
  # Первый дневной бар BTC (2020-03-25) неполный — отбрасывается.
  first_bars:
    BTCUSDT: "2020-03-25 10:36"
    ETHUSDT: "2021-03-15 00:00"
    SOLUSDT: "2021-10-15 00:00"

timeframes:
  download: [1m, 15m, 1h, 1d]
  main: 1h                  # walk-forward и отбор
  check: [15m]              # проверка устойчивости
  descriptive: [1d]         # только описательно, без walk-forward
  data_only: [1m]           # только данные и проверки согласованности
  derived: [4h]             # только clean агрегацией 1m (корзины 00, 04, …, 20 UTC); с биржи не качается

paths:
  raw: data/raw/bybit       # ответ API без изменений (минус незакрытый бар)
                            # 15m/1h/1d: <tf>/<SYMBOL>.parquet
                            # 1m: 1m/<SYMBOL>/<YYYY>.parquet (партиции по годам)
                            # funding/<SYMBOL>.parquet
  meta: data/meta/universe.csv
  clean: data/clean         # та же раскладка; без неполного первого бара; читает load()
  refetch_log: data/meta/refetch_log.csv   # журнал --refetch-last
  fetch_log: data/meta/fetch.log
  results: results
  data_quality: results/data_quality.csv            # все найденные проблемы
  data_quality_summary: results/data_quality_summary.csv   # сводка по паре×ТФ
  trials_log: results/trials_log.csv   # журнал попыток для DSR, в git
  stage5_out: results/stage5            # детальные результаты этапа 5 (не в git)
  stage5_verdicts: docs/stage5_verdicts.md   # вердикты этапа 5 (в git)
  stage6_out: results/stage6            # диагностика CPCV + PBO (не в git)
  h2_candidates: results/h2_universe_candidates.csv   # ранжирование отбора H2
  meta_h2: data/meta/universe_h2.csv     # universe новых пар H2
  h2_out: results/h2                     # результаты H2 (не в git)
  h2_verdict: docs/h2_verdict.md         # вердикт H2 (в git)
  h3_out: results/h3                     # результаты H3 (не в git)
  h3_verdict: docs/h3_verdict.md         # вердикт H3 (в git)
  h3b_out: results/h3b                   # результаты H3b (не в git)
  h3b_verdict: docs/h3b_verdict.md       # вердикт H3b (в git)

periods:                    # схема с 2026-10-04 (docs/research_program.md)
  train_end: "2024-12-31"   # включительно
  test_start: "2025-01-01"
  test_end: null            # включительно; null — до конца данных (holdout отменён)

fetch:
  enable_rate_limit: true
  kline_limit: 1000         # максимум баров на запрос Bybit
  retries: 8
  retry_codes: [10000, 10006, 10016]   # временные ошибки Bybit: тайм-аут, лимит, svc error
  backoff_seconds: 1.0      # пауза перед повтором: backoff · 2^попытка
  close_lag_seconds: 5      # бар закрыт, если open + Δ + lag ≤ серверное время
  chunk_bars: 50000         # сброс на диск каждые N баров (докачка с места обрыва)
  funding_limit: 200        # максимум записей funding на запрос Bybit

quality:
  sigma_window: 500         # окно скользящего σ для поиска выбросов, баров
  sigma_mult: 10            # |ret| > sigma_mult · σ — в отчёт
  price_rtol: 1.0e-9        # допуск сверки O/H/L/C при агрегации ТФ
  volume_rtol: 1.0e-6       # допуск сверки volume/turnover
  funding_interval_minutes: 480   # ожидаемый интервал; отклонения — в отчёт
  native_vs_1m: [15m, 1h, 1d]   # диагностика: родные бары raw против агрегата clean 1m

costs:
  fee_per_side: 0.001       # 0.1% от оборота; переворот = два оборота
  slippage_per_side: 0.0    # надбавка к fee_per_side на оборот (проскальзывание), по умолчанию 0
  include_funding: true     # положительный funding платят лонги
  rf: 0.0                   # одна и та же во всех сравнениях

annualization:
  days_per_year: 365

walk_forward:
  schemes: [expanding, rolling]
  step_months: 3            # шаг — квартал
  min_train_months: 12      # минимальное обучающее окно
  rolling_train_months: 12  # длина скользящего окна; пересмотреть на этапе 6

selection:                  # docs/preregistration.md §3–§4, §8
  top_k_max: 10             # top-k = min(top_k_max, ⌈N_pass / top_k_div⌉)
  top_k_div: 4
  cost_ratio_max: 0.2       # отсечение по cost_to_target / cost_to_width / cost_to_band
  train_dsr_min: 0.5        # торговать в фолде, только если train-DSR лучшей ≥ порога
  neff_share: 0.95          # N_eff = число собственных значений на эту долю следа
  min_trades_per_year:      # фильтр частоты на train
    1h: 12
    15m: 24
    4h: 12                  # H3: как 1h (минимум информации в год не зависит от ТФ)
    1d: 6

stage5:                     # docs/preregistration.md
  train_end_exclusive: "2024-01-01"   # граница H1–H3 (зарегистрированы до смены периодов)
  tfs: [1h, 15m]            # 1h — основной; 15m — проверка, не попытки
  schemes: [expanding, rolling]
  slippage: [0.0, 0.0005, 0.001]   # 0 — основной; остальные — sensitivity
  primary: {scheme: expanding, slippage: 0.0, rule: ensemble}
  s6_train_from: "2022-01-01"      # вариант S6 — попытка
  oos_min_trades: 30        # меньше сделок OOS у пары — «недостаточно данных»
  permutations: 20          # базовая линия шума (диагностика, не попытка)
  permutation_block: 1D     # перемешиваются целые сутки UTC

strategies:
  s2:
    corr_with_s1_exclude: 0.8   # выше — кандидат на исключение из МСП
    # S2(w, k) ≡ S1(w, z_entry=k, z_exit=0): подмножество сетки S1.
    alias_of: s1_zscore
    optimize: false             # отдельно не оптимизируется
    in_msp: false               # в МСП не входит
    log_dsr_trials: false       # попытки не пишутся в журнал DSR
  s5:
    day_boundary: "00:00"       # UTC
    # Режим границы дня (не сетка): intraday (B, основной) — принудительное
    # закрытие на close последнего бара суток UTC; carry (A) — перенос с уровнями
    # нового дня. (C) замороженные уровни дня входа — не реализован. A и C —
    # альтернативы: каждая при прогоне — отдельная попытка в журнале DSR.
    day_mode:
      1h: intraday
      15m: intraday
      1d: carry                 # на 1d (B) вырождается; 1d — только описательно
    # Без параметров (вариант (а)): в walk-forward только правило отказа
    # по порогу train-Sharpe, в журнал DSR — одна попытка.
    carry_early_bars:           # описательно: «закрыто в первые N баров новых суток»
      1h: 4
      15m: 16
  s6:
    anchor:                     # не параметр сетки
      1h: session               # якорь UTC 00:00
      15m: session
      1d: rolling
    day_mode:                   # как у S5: intraday (B) основной, carry (A) — альтернатива
      1h: intraday
      15m: intraday
      1d: carry
    min_session_bars:           # прогрев сессии (session-якорь), НЕ параметр сетки
      1h: 4                     # 4 часа; предварительно
      15m: 16                   # 4 часа; предварительно

stage6:                     # CPCV + PBO — диагностика, без вердиктов и без test
  tf: 1h
  strategies: [s1_zscore, s3_donchian, s4_supertrend]
  cscv_groups: 16           # C(16, 8) = 12 870 разбиений
  cscv_groups_alt: 8        # если embargo удаляет > embargo_share_alt IS-баров
  embargo_share_alt: 0.3
  cpcv_groups: 6            # C(6, 2) = 15 разбиений, 5 путей
  cpcv_test_groups: 2
  aggregate_symbols: [BTCUSDT, ETHUSDT]   # агрегат без SOL

h2:                         # гипотеза H2: «S4 — свойство рынка, а не трёх пар»
  selection:                # отбор вселенной без цен (src/data/select_universe.py)
    quote: USDT
    launch_max: "2021-10-15"
    exclude_base: [BTC, ETH, SOL]
    stablecoins: [USDC, USDT, DAI, TUSD, BUSD, USDD, FDUSD, USDE, PYUSD, USDP, GUSD,
                  LUSD, FRAX, UST, USTC, EURS, EUR, USD1, RLUSD, USDS]
    window_start: "2021-07-15"      # окно ликвидности — до train H2 по времени решения
    window_end: "2021-10-14"
    min_days: 92                    # полное окно (вариант (б))
    top_n: 10
  symbols: [XRPUSDT, ADAUSDT, DOGEUSDT, XTZUSDT, DOTUSDT, LTCUSDT, LINKUSDT, ETCUSDT,
            BNBUSDT, BCHUSDT]       # результат отбора 2026-10-02 (топ-10, полное окно)
  run:                      # docs/preregistration_h2.md
    strategy: s4_supertrend
    tf: 1h
    scheme: expanding
    slippage: [0.0, 0.0005]   # 0 — попытка; 0.0005 — чувствительность
    pairs_min_positive: 8     # знаковый тест: не меньше 8 из 10
    t_candidate: 1.0
    t_significant: 2.0
    dsr_significant: 0.95
    permutations: 20          # базовая линия шума (диагностика)
  tradability:              # торгуемость во времени (src/data/liquidity.py)
    period_months: 3        # окно — предыдущий квартал
    max_no_trade_share: 0.10   # доля минут без сделок; выше — позиция 0 на квартал

grids:                          # docs/preregistration.md §2; 15m — окна в барах ×4
  s1_zscore:
    1h:  {w: [24, 48, 72, 120, 168, 336], z_entry: [1.5, 2.0, 2.5, 3.0], z_exit: [0.0, 0.5, 1.0]}
    15m: {w: [96, 192, 288, 480, 672, 1344], z_entry: [1.5, 2.0, 2.5, 3.0], z_exit: [0.0, 0.5, 1.0]}
  s3_donchian:
    1h:  {w: [24, 36, 48, 72, 96, 120, 168, 240, 336, 504]}
    4h:  {w: [6, 9, 12, 18, 24, 30, 42, 60, 84, 126]}            # H3: часы / 4
    15m: {w: [96, 144, 192, 288, 384, 480, 672, 960, 1344, 2016]}
  s4_supertrend:
    1h:  {n: [24, 72], m: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]}
    4h:  {n: [6, 18], m: [1.5, 2.0, 2.5, 3.0, 3.5, 4.5, 5.5, 7.0, 8.5, 10.0]}   # H3
    15m: {n: [96, 288], m: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0]}
  s5_pivot:
    1h:  {}
    15m: {}
  s6_vwap:
    1h:  {k: [1.5, 2.0, 2.5, 3.0], e: [0.0, 0.25, 0.5, 1.0]}
    15m: {k: [1.5, 2.0, 2.5, 3.0], e: [0.0, 0.25, 0.5, 1.0]}

portfolio:
  msp_strategies: [S1, S3, S4, S5, S6]   # эффективных стратегий пять (S2 ≡ частный случай S1)
  weights_order: [EW, IV, RP, MS]   # MS — последним и со скепсисом
  msp_netting: true                 # основной вариант; отдельные счета — в отчёте

stats:
  bootstrap:
    kind: stationary          # Politis–Romano; длина блока — Politis–White
    n_boot: 10000
    seed: 42
  ce_gammas: [3, 5, 10]
  alpha: 0.05

h3:                         # docs/preregistration_h3.md
  strategies: [s3_donchian, s4_supertrend]
  tf: 4h
  scheme: expanding
  slippage: [0.0, 0.0005]   # 0 — попытки; 0.0005 — чувствительность
  pairs_min_positive: 10    # знаковый тест: не меньше 10 из 13
  t_candidate: 1.0
  t_significant: 2.0
  dsr_significant: 0.95
  permutations: 20          # базовая линия шума (диагностика)

h3b:                        # docs/preregistration_h3b.md
  strategy: s4_supertrend
  tf: 4h
  scheme: expanding
  train_end_exclusive: "2025-01-01"
  val_from: "2024-01-01"    # валидация — только кварталы 2024
  slippage: [0.0, 0.0005]   # 0 — попытка; 0.0005 — чувствительность
  min_traded: 2             # торговали ≥ 2 из 3 целевых пар
  permutations: 20
  weak_share: 0.25          # доля перестановок, прошедших критерий, → «слабое подтверждение»
